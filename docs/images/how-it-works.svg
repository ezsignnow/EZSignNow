<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How it works: place the fields, they sign on any device, everyone gets the signed copy</title>
  <rect width="1280" height="460" rx="28" fill="#f7f9f5"/>
  <text x="64" y="70" font-size="13" font-weight="700" fill="#5ba114" letter-spacing="2">HOW IT WORKS</text>
  <text x="64" y="112" font-size="36" font-weight="800" fill="#0f172a" letter-spacing="-1">Upload, sign, done</text>

  <!-- card 1 -->
  <g transform="translate(64 150)">
    <rect width="368" height="270" rx="18" fill="#fff" stroke="#e2e8f0"/>
    <rect x="24" y="22" width="320" height="120" rx="10" fill="#f7f9f5"/>
    <rect x="44" y="40" width="180" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="44" y="54" width="250" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="44" y="88" width="120" height="36" rx="6" fill="#e6f5d3" stroke="#73c41d" stroke-dasharray="4 3"/>
    <text x="104" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#3a6215">Signature</text>
    <rect x="180" y="88" width="80" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <text x="220" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Date</text>
    <circle cx="40" cy="178" r="15" fill="#5ba114"/><text x="40" y="183" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text>
    <text x="24" y="222" font-size="19" font-weight="800" fill="#0f172a">Place the fields</text>
    <text x="24" y="246" font-size="14" fill="#64748b">Upload a PDF, add signers in order,</text>
    <text x="24" y="264" font-size="14" fill="#64748b">and drop each field where it belongs.</text>
  </g>

  <!-- card 2 -->
  <g transform="translate(456 150)">
    <rect width="368" height="270" rx="18" fill="#fff" stroke="#e2e8f0"/>
    <rect x="24" y="22" width="320" height="120" rx="10" fill="#f7f9f5"/>
    <rect x="104" y="36" width="160" height="26" rx="13" fill="#fff" stroke="#e2e8f0"/>
    <rect x="106" y="38" width="78" height="22" rx="11" fill="#e6f5d3"/>
    <text x="145" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#3a6215">Draw</text>
    <text x="224" y="53" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">Type</text>
    <path d="M90 118c14-26 22-28 28-10 5 16 11 16 20-2l12 14c9-20 16-22 23-8 6 10 13 7 21-4l14 10c8-12 15-10 21 0 5 7 11 6 18-2" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="40" cy="178" r="15" fill="#5ba114"/><text x="40" y="183" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text>
    <text x="24" y="222" font-size="19" font-weight="800" fill="#0f172a">They sign, on any device</text>
    <text x="24" y="246" font-size="14" fill="#64748b">Each signer opens their own link and</text>
    <text x="24" y="264" font-size="14" fill="#64748b">draws or types. No account needed.</text>
  </g>

  <!-- card 3 -->
  <g transform="translate(848 150)">
    <rect width="368" height="270" rx="18" fill="#fff" stroke="#e2e8f0"/>
    <rect x="24" y="22" width="320" height="120" rx="10" fill="#f7f9f5"/>
    <rect x="120" y="34" width="84" height="100" rx="6" fill="#fff" stroke="#e2e8f0" transform="rotate(-6 162 84)"/>
    <rect x="146" y="30" width="84" height="100" rx="6" fill="#fff" stroke="#e2e8f0"/>
    <rect x="158" y="46" width="56" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="158" y="58" width="44" height="5" rx="2.5" fill="#e2e8f0"/>
    <circle cx="214" cy="104" r="20" fill="#5ba114"/>
    <path d="M205 104l6 6 12-13" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="40" cy="178" r="15" fill="#5ba114"/><text x="40" y="183" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text>
    <text x="24" y="222" font-size="19" font-weight="800" fill="#0f172a">Everyone gets the copy</text>
    <text x="24" y="246" font-size="14" fill="#64748b">Signers, copy recipients and you get the</text>
    <text x="24" y="264" font-size="14" fill="#64748b">signed PDF with its audit certificate.</text>
  </g>
</svg>
