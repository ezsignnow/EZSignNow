<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>
  <!-- Background Squircle with Gradient -->
  <rect width="512" height="512" rx="128" fill="url(#gradient)" />
  <!-- Document and Pen Icon -->
  <g fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" transform="translate(106, 96)" filter="url(#shadow)">
    <!-- Document border -->
    <path d="M190 20H50c-16.5 0-30 13.5-30 30v220c0 16.5 13.5 30 30 30h200c16.5 0 30-13.5 30-30V110L190 20z" stroke-width="32" />
    <!-- Folder Fold -->
    <path d="M190 20v90h90" stroke-width="32" />
    <!-- Document Lines -->
    <path d="M60 170h110" stroke-width="24" />
    <path d="M60 230h70" stroke-width="24" />
    <!-- Signature Pencil -->
    <g transform="translate(170, 160) rotate(-45)">
      <!-- Pencil Body -->
      <rect x="-16" y="-50" width="32" height="100" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="8" />
      <!-- Pencil Tip -->
      <path d="M-16 50L0 80L16 50Z" fill="#ffffff" />
      <path d="M-6 65L0 80L6 65Z" fill="#1d4ed8" />
    </g>
  </g>
</svg>
